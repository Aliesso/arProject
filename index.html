<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Layihə</title>

  <!-- A-Frame və MindAR (şəkil izləmə) -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    /* Fon rəngi verməyin: MindAR kamera videosunu arxada (mənfi z-index) göstərir */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    #status {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      z-index: 10; padding: 8px 16px; border-radius: 20px;
      background: rgba(0, 0, 0, 0.6); color: #fff;
      font: 15px/1.3 system-ui, sans-serif; text-align: center;
      pointer-events: none;
    }
    #status.found { background: rgba(20, 140, 60, 0.8); }
  </style>
</head>
<body>
  <div id="status">Kameranı hədəf şəklə tut...</div>

  <!-- imageTargetSrc: tanınacaq şəklin .mind faylı (öz şəkliniz) -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item id="model"
        src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/softmind/scene.gltf">
      </a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-light type="ambient" intensity="0.8"></a-light>
    <a-light type="directional" position="1 2 2" intensity="1"></a-light>

    <!-- targetIndex: 0 → .mind faylındakı birinci şəkil -->
    <a-entity id="target" mindar-image-target="targetIndex: 0">

      <!-- 3D model (GLTF) -->
      <a-gltf-model
        src="#model"
        position="0 -0.25 0.1"
        rotation="0 0 0"
        scale="0.05 0.05 0.05"
        animation="property: position; to: 0 -0.15 0.1; dir: alternate; loop: true; dur: 1500; easing: easeInOutSine">
      </a-gltf-model>

      <!-- Sadə 3D fiqurlar (model yüklənməsə də görünür) -->
      <a-box
        position="-0.35 0 0.15" width="0.2" height="0.2" depth="0.2" color="#4CC3D9"
        animation="property: rotation; to: 360 360 0; loop: true; dur: 4000; easing: linear">
      </a-box>
      <a-sphere
        position="0.35 0 0.15" radius="0.12" color="#EF2D5E"
        animation="property: position; to: 0.35 0.2 0.15; dir: alternate; loop: true; dur: 1000; easing: easeInOutQuad">
      </a-sphere>
      <a-torus-knot
        position="0 0.35 0.15" radius="0.1" radius-tubular="0.02" color="#FFC65D"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear">
      </a-torus-knot>
    </a-entity>
  </a-scene>

  <script>
    const status = document.getElementById('status');
    const target = document.getElementById('target');
    const scene = document.querySelector('a-scene');

    target.addEventListener('targetFound', () => {
      status.textContent = 'Hədəf tapıldı!';
      status.classList.add('found');
    });
    target.addEventListener('targetLost', () => {
      status.textContent = 'Kameranı hədəf şəklə tut...';
      status.classList.remove('found');
    });
    scene.addEventListener('arError', () => {
      status.textContent = 'Kamera açılmadı. HTTPS və kamera icazəsini yoxlayın.';
    });
  </script>
</body>
</html>
